<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trakya Teknik Makine — Disan Hidrolik Makine Trakya Bölge Yetkili Servisi. Endüstriyel makine yedek parça temini, yerinde teknik destek, bakım ve onarım çözümleri.">
  <title>Trakya Teknik Makine — Disan Hidrolik Makine Trakya Bölge Yetkili Servisi</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <!-- Header Application Shell -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="brand-wrapper">
          <div class="brand-title">Trakya Teknik <span>Makine</span></div>
        </div>
        <div class="header-status">
          <span class="badge-authorized" id="header-status-badge">Disan Hidrolik Trakya Bölge Yetkili Servisi</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Workspace Shell -->
  <main id="app" class="site-main">
    <!-- WAVE_01 Hero Section Mount Point -->
  </main>

  <!-- Footer Application Shell -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div>
          <strong>Trakya Teknik Makine</strong> &copy; 2026. Tüm hakları saklıdır.
        </div>
        <div id="footer-status-tag" class="text-muted">
          Disan Hidrolik Makine Trakya Bölge Yetkili Servisi
        </div>
      </div>
    </div>
  </footer>

  <!-- Application Initializer Script -->
  <script type="module">
    import dataService from './src/services/dataService.js';
    import { renderHeroSection } from './src/components/HeroSection.js';
    import { renderServicesSection } from './src/components/ServicesSection.js';
    import { renderContactSection } from './src/components/ContactSection.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const appEl = document.getElementById('app');
      
      // Render WAVE_01 Hero Surface
      const heroEl = await renderHeroSection(dataService);
      appEl.appendChild(heroEl);

      // Render WAVE_02 Core Services Surface
      const servicesEl = await renderServicesSection(dataService);
      appEl.appendChild(servicesEl);

      // Render WAVE_03 Direct Contact Surface
      const contactEl = await renderContactSection(dataService);
      appEl.appendChild(contactEl);
    });
  </script>
</body>
</html>
